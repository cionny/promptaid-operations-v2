# OMIRL Livelli Idrometrici Thresholds Configuration
# Minimal config: station codes mapped to alert thresholds (meters)
# All other metadata (località, comune, provincia, bacino, etc.) is scraped from live OMIRL tables

metadata:
  version: "2.0"
  last_updated: "2025-11-06"
  source: "OMIRL Alert System - Regione Liguria"
  description: "Alert thresholds for hydrometric stations across Liguria"
  note: "Single source of truth for threshold values only. Geographic data comes from OMIRL scraping."

