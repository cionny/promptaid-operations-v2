# ============================================================================
# TOOL-SPECIFIC CONFIGURATIONS
# Each tool has its own thresholds, analysis rules, and defaults
# ============================================================================

tools:
  # --------------------------------------------------------------------------
  # HYDRO STATIONS TOOL (Livelli Idrometrici)
  # Monitors river water levels against station-specific thresholds
  # --------------------------------------------------------------------------
  hydro_stations:
    # Station-specific thresholds (meters)
    # yellow = soglia 2 (guardia), red = soglia 3 (pericolo)
    # Data source: CSV truth from operations/data/regione/livelli idro - full.csv
    thresholds:
      # Zona A (Ponente)
      AIROL:  { yellow: 5.5, red: 7.1 }
      MOBRA:  { yellow: 4.0, red: 4.8 }
      CISAN:  { yellow: 2.8, red: 4.0 }
      DCQUA:  { yellow: 4.0, red: 5.0 }
      ISBON:  { yellow: 3.3, red: 4.3 }
      AMERE:  { yellow: 3.0, red: 4.5 }
      MONTL:  { yellow: 5.0, red: 7.0 }
      PTECH:  { yellow: 4.0, red: 5.0 }
      POGLI:  { yellow: 3.5, red: 5.0 }
      RUGGE:  { yellow: 1.6, red: 2.7 }
      TORRI:  { yellow: 2.5, red: 3.1 }
      ARMEA:  { yellow: 1.3, red: 2.0 }
      XXMPA:  { yellow: 1.3, red: 2.0 }
      
      # Zona B (Centro-Ponente)
      BOLSN:  { yellow: 1.8, red: 2.5 }
      ELLRA:  { yellow: 4.5, red: 5.3 }
      GEFER:  { yellow: 1.3, red: 1.5 }
      FIRPO:  { yellow: 3.0, red: 4.5 }
      GEGEI:  { yellow: 2.0, red: 3.0 }
      VAREN:  { yellow: 2.0, red: 3.0 }
      GEMOL:  { yellow: 2.6, red: 3.5 }
      GEPTX:  { yellow: 2.8, red: 4.2 }
      GERIV:  { yellow: 3.8, red: 5.0 }
      GSTUR:  { yellow: 1.5, red: 2.4 }
      LAPRS:  { yellow: 2.5, red: 3.0 }
      MOLIN:  { yellow: 2.4, red: 3.8 }
      SANTU:  { yellow: 2.0, red: 3.2 }
      SSGIU:  { yellow: 2.0, red: 2.7 }
      
      # Zona C (Centro-Levante)
      AMEFM:  { yellow: 2.0, red: 3.3 }
      BGNNE:  { yellow: 2.0, red: 3.0 }
      BVARA:  { yellow: 2.8, red: 2.5 }  # Note: red < yellow in source data
      CALAM:  { yellow: 4.0, red: 5.8 }
      CAMIN:  { yellow: 1.9, red: 2.8 }
      CARPB:  { yellow: 4.5, red: 5.5 }
      FRNLA:  { yellow: 3.8, red: 5.0 }
      LAMAC:  { yellow: 0.7, red: 1.2 }
      NASCE:  { yellow: 4.5, red: 5.5 }
      PANES:  { yellow: 2.6, red: 3.7 }
      PBATT:  { yellow: 4.0, red: 5.0 }
      PICCA:  { yellow: null, red: null }  # No threshold data available
      PMAGR:  { yellow: 3.5, red: 5.0 }
      PTEGL:  { yellow: 3.0, red: 4.0 }
      SMART:  { yellow: 2.1, red: 3.1 }
      SLEVA:  { yellow: 3.7, red: 4.7 }
      SLPSS:  { yellow: 2.0, red: 3.2 }
      SOLIE:  { yellow: 3.5, red: 4.5 }
      VIGNO:  { yellow: 3.5, red: 4.5 }
      
      # Zona D (Padani di Ponente)
      CAMPL:  { yellow: 2.5, red: 4.0 }
      CARCA:  { yellow: 2.3, red: 2.8 }
      CENGI:  { yellow: 3.0, red: 4.0 }
      FERRA:  { yellow: 3.0, red: 3.5 }
      MURIA:  { yellow: 2.0, red: 2.5 }
      PCRIX:  { yellow: 4.0, red: 5.0 }
      TIGLT:  { yellow: 3.5, red: 4.5 }
      
      # Zona E (Padani di Levante)
      CABAN:  { yellow: 1.8, red: 2.5 }
      MONTG:  { yellow: 4.0, red: 5.0 }
      ROVPT:  { yellow: 3.5, red: 5.0 }
      VOBBI:  { yellow: 3.5, red: 4.5 }

    # Threshold analysis configuration
    analysis_config:
      # Percentage of yellow threshold to consider "near threshold" (watch status)
      near_threshold_percentage: 0.85  # 85% of yellow threshold
      
      # Alert level mapping (Protezione Civile terminology)
      alert_levels:
        rossa: "red"          # Criticità elevata - Above red threshold (soglia 3 - pericolo)
        gialla: "yellow"      # Criticità moderata - Above yellow threshold (soglia 2 - guardia)
        pre-soglia: "near"    # Criticità ordinaria - Between 85% and 100% of yellow threshold (soglia 1)
        verde: "below"        # Criticità assente - Below 85% of yellow threshold

  # --------------------------------------------------------------------------
  # RAIN STATIONS TOOL (Precipitazioni)
  # Monitors rainfall accumulation across multiple time periods
  # --------------------------------------------------------------------------
  precipitazioni:
    # Default time period when user doesn't specify
    default_time_period: "1h"
    
    # Time period configurations
    # Each period has:
    # - labels: Natural language patterns to match user queries
    # - thresholds: Alert levels (green/yellow/red) in millimeters
    # Data source: precipitazioni.yaml (validated)
    time_periods:
      "15'":
        labels:
          - "ultimi 15 minuti"
          - "ultimi 15 min"
          - "ultimo quarto d'ora"
        thresholds:
          green:
            max: 10
          yellow:
            min: 10
            max: 16
          red:
            min: 16
      "30'":
        labels:
          - "ultimi 30 minuti"
          - "ultimi 30 min"
          - "ultima mezz'ora"
        thresholds:
          green:
            max: 15
          yellow:
            min: 15
            max: 30
          red:
            min: 30
      "1h":
        labels:
          - "ultima ora"
          - "ultimi 60 minuti"
        thresholds:
          green:
            max: 25
          yellow:
            min: 25
            max: 40
          red:
            min: 40
      "3h":
        labels:
          - "ultime 3 ore"
          - "ultime tre ore"
        thresholds:
          green:
            max: 50
          yellow:
            min: 50
            max: 80
          red:
            min: 80
      "6h":
        labels:
          - "ultime 6 ore"
          - "ultime sei ore"
        thresholds:
          green:
            max: 70
          yellow:
            min: 70
            max: 100
          red:
            min: 100
      "12h":
        labels:
          - "ultime 12 ore"
          - "ultime dodici ore"
        thresholds:
          green:
            max: 120
          yellow:
            min: 120
            max: 180
          red:
            min: 180
      "24h":
        labels:
          - "ultime 24 ore"
          - "ultimo giorno"
        thresholds:
          green:  
            max: 150
          yellow:
            min: 150
            max: 225
          red:
            min: 225
      "7d":
        labels:
          - "ultimi 7 giorni"
          - "ultima settimana"
        thresholds:
          green:
            max: 150
          yellow:
            min: 150
            max: 225
          red:
            min: 225
      "15d":
        labels:
          - "ultimi 15 giorni"
          - "ultime due settimane"
        thresholds:
          green:
            max: 150
          yellow:
            min: 150
            max: 225
          red:
            min: 225
      "30d":
        labels:
          - "ultimi 30 giorni"
          - "ultimo mese"
        thresholds:
          green:
            max: 175
          yellow:
            min: 175
            max: 300
          red:
            min: 300

    # Severity level descriptions (Protezione Civile terminology)
    severity_levels:
      red:
        description: "Criticità elevata - rainfall exceeds red threshold"
        action: "Emergency protocols active"
      yellow:
        description: "Criticità moderata - rainfall exceeds yellow threshold"
        action: "Enhanced monitoring required"
      green:
        description: "Criticità ordinaria - rainfall within normal parameters"
        action: "Standard monitoring"
