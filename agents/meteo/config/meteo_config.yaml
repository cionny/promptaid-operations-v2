version: "2.0"
last_updated: "2025-11-06"

# ============================================================================
# SHARED GEOGRAPHY DATA
# Used by all MeteoAgent tools for province/zone/comune filtering
# ============================================================================
geography:
  # Province mappings (handles both "Savona" and "SV" user inputs)
  provinces:
    name_to_code_mapping:
      Genova: "GE"
      Savona: "SV"
      Imperia: "IM"
      La Spezia: "SP"
    
    # Full data for each province
    GE:
      name: "Genova"
      alert_zones: ["A", "B", "D", "E"]
    SV:
      name: "Savona"
      alert_zones: ["A", "B", "D"]
    IM:
      name: "Imperia"
      alert_zones: ["A", "B"]
    SP:
      name: "La Spezia"
      alert_zones: ["C", "E"]

  # Alert zone descriptions (Protezione Civile Liguria)
  alert_zones:
    A:
      name: "Bacini Marittimi di Ponente"
      description: "Coastal basins - western Liguria (Imperia, western Savona)"
    B:
      name: "Bacini Marittimi di Centro"
      description: "Coastal basins - central Liguria (eastern Savona, western Genova)"
    C:
      name: "Bacini Marittimi di Levante"
      description: "Coastal basins - eastern Liguria (La Spezia)"
    D:
      name: "Bacini Padani di Ponente"
      description: "Po Valley basins - western Liguria (northern Savona, northern Genova)"
    E:
      name: "Bacini Padani di Levante"
      description: "Po Valley basins - eastern Liguria (northern Genova, northern La Spezia)"

