# OMIRL Precipitazioni Thresholds Configuration
# Ligurian civil protection defines 21 alert steps for rainfall intensity.
# To keep this tool lightweight we collapse them into three operational bands:
#   - green  → ordinaria / no concern
#   - yellow → attenzione (approx. former orange)
#   - red    → criticità elevata

# Thresholds are provided in millimetres of accumulated precipitation for each
# time window used by OMIRL. Values can be tuned as new calibration data becomes
# available; the defaults below follow the regional guidance ratios.

units: "mm"
default_time_period: "1h"

severity_levels:
  green:
    label: "soglia verde"
    description: "Pioggia debole o assente"
  yellow:
    label: "soglia gialla"
    description: "Pioggia moderata / attenzione"
  red:
    label: "soglia rossa"
    description: "Pioggia intensa / criticità elevata"

time_periods:
  "15'":
    labels:
      - "ultimi 15 minuti"
      - "ultimi 15 min"
      - "ultimo quarto d'ora"
    thresholds:
      green:
        max: 10
      yellow:
        min: 10
        max: 16
      red:
        min: 16
  "30'":
    labels:
      - "ultimi 30 minuti"
      - "ultimi 30 min"
      - "ultima mezz'ora"
    thresholds:
      green:
        max: 15
      yellow:
        min: 15
        max: 30
      red:
        min: 30
  "1h":
    labels:
      - "ultima ora"
      - "ultimi 60 minuti"
    thresholds:
      green:
        max: 25
      yellow:
        min: 25
        max: 40
      red:
        min: 40
  "3h":
    labels:
      - "ultime 3 ore"
      - "ultime tre ore"
    thresholds:
      green:
        max: 50
      yellow:
        min: 50
        max: 80
      red:
        min: 80
  "6h":
    labels:
      - "ultime 6 ore"
      - "ultime sei ore"
    thresholds:
      green:
        max: 70
      yellow:
        min: 70
        max: 100
      red:
        min: 100
  "12h":
    labels:
      - "ultime 12 ore"
      - "ultime dodici ore"
    thresholds:
      green:
        max: 120
      yellow:
        min: 120
        max: 180
      red:
        min: 180
  "24h":
    labels:
      - "ultime 24 ore"
      - "ultimo giorno"
    thresholds:
      green:  
        max: 150
      yellow:
        min: 150
        max: 225
      red:
        min: 225
  "7d":
    labels:
      - "ultimi 7 giorni"
      - "ultima settimana"
    thresholds:
      green:
        max: 150
      yellow:
        min: 150
        max: 225
      red:
        min: 225
  "15d":
    labels:
      - "ultimi 15 giorni"
      - "ultime due settimane"
    thresholds:
      green:
        max: 150
      yellow:
        min: 150
        max: 225
      red:
        min: 225
  "30d":
    labels:
      - "ultimi 30 giorni"
      - "ultimo mese"
    thresholds:
      green:
        max: 175
      yellow:
        min: 175
        max: 300
      red:
        min: 300